name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilation APK Android
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code
      - name: Récupération du code
        uses: actions/checkout@v4

      # 2. Configuration de Node.js
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Installation des dépendances
      - name: Installation des dépendances npm
        run: npm install

      # 4. Compilation du frontend
      - name: Compilation du frontend Web
        run: npm run build

      # 5. Configuration de Java 17 (sans cache gradle pour éviter l'erreur)
      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 6. Création automatique du dossier Android natif
      - name: Initialisation et synchronisation Android
        run: |
          npx cap add android || true
          npx cap sync android

      # 7. Permissions Gradle
      - name: Permissions d'exécution Gradle
        run: chmod +x android/gradlew

      # 8. Compilation de l'APK (assembleDebug = installable immédiatement sur tout téléphone)
      - name: Compilation de l'APK Android
        run: |
          cd android
          ./gradlew assembleDebug

      # 9. Préparation du fichier
      - name: Préparation de l'APK
        run: |
          mkdir -p apk_output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk_output/Adhan-Algeria.apk

      # 10. Téléversement dans les Artifacts GitHub
      - name: Téléverser l'APK en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: Adhan-Algeria-APK
          path: apk_output/Adhan-Algeria.apk
          retention-days: 30

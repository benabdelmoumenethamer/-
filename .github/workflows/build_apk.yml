name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilation APK Android
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code
      - name: Récupération du code source
        uses: actions/checkout@v4

      # 2. Configuration de Node.js
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Installation des dépendances et de Capacitor 7 LTS
      - name: Installation des dépendances et de Capacitor
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0 --legacy-peer-deps

      # 4. Compilation du frontend Web
      - name: Compilation du frontend Web
        run: npm run build

      # 5. Configuration de Java 17
      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 6. Configuration Capacitor en JSON pur
      - name: Configuration Capacitor en JSON
        run: |
          rm -f capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.adhan.algeria.app",
            "appName": "Adhan",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      # 7. Initialisation et synchronisation Android
      - name: Initialisation et synchronisation Android
        run: |
          rm -rf android
          npx @capacitor/cli add android
          npx @capacitor/cli sync android

      # 8. Verrouillage SDK Android 34 (100% préinstallé et stable sur GitHub Actions)
      - name: Ajustement SDK Android 34
        run: |
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 34/g' android/variables.gradle || true
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 34/g' android/variables.gradle || true
          sed -i 's/compileSdkVersion = 36/compileSdkVersion = 34/g' android/variables.gradle || true
          sed -i 's/targetSdkVersion = 36/targetSdkVersion = 34/g' android/variables.gradle || true
          echo "org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8" >> android/gradle.properties
          chmod +x android/gradlew

      # 9. Compilation de l'APK (Debug installable)
      - name: Compilation de l'APK Android (Debug installable)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 10. Préparation de l'APK
      - name: Préparation de l'APK
        run: |
          mkdir -p apk_output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk_output/Adhan-Algeria.apk

      # 11. Téléversement dans les Artifacts GitHub
      - name: Téléverser l'APK en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: Adhan-Algeria-APK
          path: apk_output/Adhan-Algeria.apk
          retention-days: 30

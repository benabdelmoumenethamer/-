name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilation APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # 1. Récupération du code source
      - name: Récupération du code source
        uses: actions/checkout@v4

      # 2. Configuration de Node.js
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Installation des dépendances du projet
      - name: Installation des dépendances NPM
        run: npm install --legacy-peer-deps

      # 4. Compilation du frontend Web (génère dist/)
      - name: Compilation du frontend Web
        run: npm run build

      # 5. Configuration de Java 21 (Obligatoire pour Capacitor 7 et AGP 8.7+)
      - name: Configuration de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 6. Configuration automatique et cache de Gradle
      - name: Configuration de Gradle
        uses: gradle/actions/setup-gradle@v4

      # 7. Acceptation automatique des licences du SDK Android préinstallé
      - name: Acceptation des licences Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 8. Synchronisation des fichiers web compilés vers le projet Android Capacitor
      - name: Synchronisation Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx @capacitor/cli add android
          fi
          npx @capacitor/cli sync android

      # 9. Compilation de l'APK (Debug installable)
      - name: Compilation de l'APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 10. Préparation de l'APK final
      - name: Préparation de l'APK
        run: |
          mkdir -p apk_output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk_output/Adhan-Algeria.apk
          ls -lh apk_output/Adhan-Algeria.apk

      # 11. Téléversement dans les Artifacts GitHub pour téléchargement direct
      - name: Téléverser l'APK (GitHub Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Adhan-Algeria-APK
          path: apk_output/Adhan-Algeria.apk
          retention-days: 30

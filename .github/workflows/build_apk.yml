name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilation APK Android
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code
      - name: Récupération du code source
        uses: actions/checkout@v4

      # 2. Configuration de Node.js
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Installation des dépendances et de Capacitor
      - name: Installation des dépendances et de Capacitor
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      # 4. Compilation du frontend Web
      - name: Compilation du frontend Web
        run: npm run build

      # 5. Configuration de Java 17
      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 6. Configuration Capacitor en JSON pur (évite l'erreur loadExtConfigTS)
      - name: Configuration Capacitor en JSON
        run: |
          rm -f capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.adhan.algeria.app",
            "appName": "Adhan",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      # 7. Initialisation et synchronisation Android
      - name: Initialisation et synchronisation Android
        run: |
          npx @capacitor/cli add android || true
          npx @capacitor/cli sync android

      # 8. Permissions d'exécution Gradle
      - name: Permissions d'exécution Gradle
        run: chmod +x android/gradlew

      # 9. Compilation de l'APK (Debug installable sur tout smartphone)
      - name: Compilation de l'APK Android (Debug installable)
        run: |
          cd android
          ./gradlew assembleDebug

      # 10. Préparation de l'APK
      - name: Préparation de l'APK
        run: |
          mkdir -p apk_output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk_output/Adhan-Algeria.apk

      # 11. Téléversement dans les Artifacts GitHub
      - name: Téléverser l'APK en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: Adhan-Algeria-APK
          path: apk_output/Adhan-Algeria.apk
          retention-days: 30
